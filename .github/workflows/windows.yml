name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'NotchBuddy/Resources/sounds/**'
      - 'LICENSE*'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'NotchBuddy/Resources/sounds/**'
      - 'LICENSE*'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo +stable fmt --all -- --check

      - name: Check package versions
        run: npm run check:versions

      - name: Install test browser
        run: npx playwright install chromium

      - name: Test AI settings and chat UI
        run: npm run test:ui

      - name: Build installer
        run: npm run pack

      - name: Test Rust workspace
        run: cargo +stable test --workspace --release --locked

      - name: Upload installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MoMo-Windows-x64
          path: windows/release/*/
          if-no-files-found: error
          retention-days: 14
